name: build-drivers

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2
        with:
          # The WDK on the runner only ships x64/arm64 InfVerif.dll
          msbuild-architecture: x64

      - name: Check for Windows Driver Kit
        shell: pwsh
        run: |
          $kits = 'C:\Program Files (x86)\Windows Kits\10'
          Get-ChildItem "$kits\Include" | Select-Object -ExpandProperty Name
          $wdm = Get-ChildItem "$kits\Include\*\km\wdm.h" -ErrorAction SilentlyContinue
          if (-not $wdm) { throw 'WDK headers not found on runner' }
          $wdm | Select-Object -ExpandProperty FullName

      - name: Collect WDK diagnostics
        shell: pwsh
        run: |
          $diag = Join-Path $env:RUNNER_TEMP 'logs'
          New-Item -ItemType Directory -Force $diag | Out-Null
          $kits = 'C:\Program Files (x86)\Windows Kits\10'
          Get-ChildItem "$kits\build\*\WindowsDriver.common.targets" | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $diag ("targets-" + $_.Directory.Name + ".xml"))
          }
          Get-ChildItem $kits -Recurse -Include 'InfVerif*','Inf2Cat*' -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName | Out-File (Join-Path $diag 'wdk-tools.txt')

      - name: Build drivers
        shell: pwsh
        run: |
          $projects = @(
            'sklhdaudbus\sklhdaudbus\sklhdaudbus.vcxproj',
            'da7219\da7219\da7219.vcxproj',
            'sofapl\sofapl\sofapl.vcxproj',
            # sofaudio (adapted Microsoft SimpleAudioSample): libs first, then the driver
            'sofaudio\Source\Utilities\Utilities.vcxproj',
            'sofaudio\Source\Filters\Filters.vcxproj',
            'sofaudio\Source\Main\Main.vcxproj'
          )
          foreach ($p in $projects) {
            Write-Host "=== Building $p"
            $log = Join-Path $env:RUNNER_TEMP ("logs\build-" + [IO.Path]::GetFileNameWithoutExtension($p) + ".log")
            msbuild $p /m /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /p:EnableInf2cat=false /p:SpectreMitigation=false /v:minimal "/flp:logfile=$log;verbosity=normal"
            $code = $LASTEXITCODE
            # Surface compiler/linker/INF errors and warnings as annotations
            Select-String -Path $log -Pattern ': (fatal )?error |: warning (C|LNK|INF|DRV|1)' |
              Select-Object -ExpandProperty Line -Unique | Select-Object -First 40 | ForEach-Object {
                $lvl = if ($_ -match ': (fatal )?error ') { 'error' } else { 'warning' }
                Write-Host "::$lvl::$($_.Trim())"
              }
            if ($code -ne 0) { throw "Build failed: $p" }
          }

      - name: Collect packages and create catalogs
        shell: pwsh
        run: |
          $kits = 'C:\Program Files (x86)\Windows Kits\10'
          $inf2cat = Get-ChildItem "$kits\bin\*\x86\Inf2Cat.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $inf2cat) { throw 'Inf2Cat not found' }
          $out = Join-Path $PWD 'out'

          # SOF firmware for Apollo Lake (Intel-signed, SOF v2.2), pinned by tag + hash
          $fwUrl = 'https://raw.githubusercontent.com/thesofproject/sof-bin/v2026.09.2/v2.2.x/sof-v2.2/intel-signed/sof-apl.ri'
          $fwSha = 'D63499833BB20352E63907E2409F8246DF278A15CF7C73A24AEEFAFF19FB1A43'
          New-Item -ItemType Directory -Force (Join-Path $out 'sofapl') | Out-Null
          $fw = Join-Path $out 'sofapl\intel-sof-apl.ri'
          Invoke-WebRequest $fwUrl -OutFile $fw
          $got = (Get-FileHash $fw -Algorithm SHA256).Hash
          if ($got -ne $fwSha) { throw "Firmware hash mismatch: $got" }
          Invoke-WebRequest 'https://raw.githubusercontent.com/thesofproject/sof-bin/v2026.09.2/LICENCE.Intel' -OutFile (Join-Path $out 'sofapl\LICENCE.Intel.txt')

          # package folder -> binary/INF base name
          $packages = [ordered]@{
            'sklhdaudbus' = 'sklhdaudbus'
            'da7219'      = 'da7219'
            'sofapl'      = 'sofapl'
            'sofaudio'    = 'SimpleAudioSample'
          }
          foreach ($name in $packages.Keys) {
            $base = $packages[$name]
            $sys = Get-ChildItem -Recurse -Filter "$base.sys" | Where-Object { $_.FullName -match 'Release' -and $_.FullName -notmatch '\\out\\' } | Select-Object -First 1
            if (-not $sys) { throw "$base.sys not found" }
            # Prefer the stamped INF that the build put next to the .sys
            $inf = Get-ChildItem $sys.DirectoryName -Recurse -Filter "$base.inf" | Select-Object -First 1
            if (-not $inf) { $inf = Get-ChildItem -Recurse -Filter "$base.inf" | Where-Object FullName -notmatch '\\out\\' | Select-Object -First 1 }
            if (-not $inf) { throw "$base.inf not found" }
            $dest = Join-Path $out $name
            New-Item -ItemType Directory -Force $dest | Out-Null
            Copy-Item $sys.FullName, $inf.FullName $dest
            Write-Host "=== $name : $($sys.FullName) + $($inf.FullName)"
            & $inf2cat.FullName /driver:$dest /os:10_X64 /uselocaltime
            if ($LASTEXITCODE -ne 0) { throw "Inf2Cat failed for $name" }
          }
          Get-ChildItem -Recurse $out | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: drivers-unsigned
          path: out/

      # Publish to a rolling "latest-build" pre-release so the package can be
      # downloaded without signing in.
      - name: Publish latest-build release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path out\* -DestinationPath drivers-unsigned.zip -Force
          gh release delete latest-build --yes --cleanup-tag 2>$null
          gh release create latest-build drivers-unsigned.zip --prerelease --target $env:GITHUB_SHA `
            --title "Latest build ($($env:GITHUB_SHA.Substring(0,7)))" `
            --notes "Unsigned test build. Sign and install with scripts/install-drivers.ps1."
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed' }

      # Always publish the full build logs (success or failure) so they can be
      # read without signing in to GitHub.
      - name: Publish build logs
        if: always() && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $diag = Join-Path $env:RUNNER_TEMP 'logs'
          New-Item -ItemType Directory -Force $diag | Out-Null
          "commit $env:GITHUB_SHA run $env:GITHUB_RUN_ID" | Out-File (Join-Path $diag 'info.txt')
          Compress-Archive -Path "$diag\*" -DestinationPath build-logs.zip -Force
          gh release delete build-logs --yes --cleanup-tag 2>$null
          gh release create build-logs build-logs.zip --prerelease --target $env:GITHUB_SHA `
            --title "Build logs ($($env:GITHUB_SHA.Substring(0,7)))" --notes "Logs from the most recent CI run."
